name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # Turn the important error lines into annotations so they can be read through the API.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|error:|What went wrong|^> |Could not|FAILED|Exception:" build.log \
            | grep -v "^\s*at " | head -150 > errs.txt || true
          if [ ! -s errs.txt ]; then tail -60 build.log > errs.txt; fi
          split -l 15 errs.txt part_
          n=0
          for f in part_*; do
            n=$((n+1)); [ $n -gt 9 ] && break
            msg=$(sed 's/%/%25/g; s/\r//g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build error $n::${msg}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EV3SpaceSound-apk
          path: app/build/outputs/apk/debug/*.apk
